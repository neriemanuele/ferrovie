<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="SIRER - Reti autostradali dell'Emilia-Romagna"><title>SIRER - Reti autostradali</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Host+Grotesk:wght@500&display=swap"><link rel="stylesheet" href="./styles.css?v=10">
<style>
.road-head{display:flex;align-items:flex-end;justify-content:space-between;gap:1rem;margin-bottom:1.5rem}.road-actions{display:flex;gap:.7rem;flex-wrap:wrap}.route-card{background:#fff;border:1px solid var(--line);border-top:5px solid #028105;border-radius:10px;box-shadow:var(--shadow);overflow:auto;padding:1.5rem}.route-title{text-align:center;margin:0;font-size:1.25rem}.route-sub{text-align:center;color:var(--muted);margin:.25rem 0 1.5rem}.scheme{width:760px;max-width:100%;margin:auto}.directions{display:grid;grid-template-columns:280px 200px 280px;align-items:end;margin-bottom:8px;font-size:13px}.directions .south{text-align:right;color:#11842e;padding-right:12px}.directions .north{text-align:left;color:#df4b39;padding-left:12px}
.route{position:relative;padding:4px 0}.route::before{content:"";position:absolute;top:0;bottom:0;left:50%;width:82px;transform:translateX(-50%);background:linear-gradient(90deg,#e7ef1c 0 2px,#6d6d6d 2px 39px,#07952b 39px 43px,#6d6d6d 43px 80px,#e7ef1c 80px 82px);box-shadow:inset 19px 0 rgba(255,255,255,.035),inset -19px 0 rgba(255,255,255,.035)}
.row{position:relative;display:grid;grid-template-columns:280px 200px 280px;min-height:52px;align-items:center}.row .left,.row .right{font-size:12px;line-height:1.25;color:#111}.row .left{text-align:right;padding-right:13px}.row .right{text-align:left;padding-left:13px}.row .mid{height:100%;position:relative}.row.exit .mid::before,.row.link .mid::before{content:"";position:absolute;top:50%;left:59px;right:59px;height:2px;background:#eef31b;transform:translateY(-50%)}.row.exit .mid::after,.row.link .mid::after{content:"";position:absolute;top:50%;left:50%;width:19px;height:11px;transform:translate(-50%,-50%);background:#eef31b;border:1px solid #222;clip-path:polygon(0 50%,30% 0,100% 0,100% 100%,30% 100%)}.row.service .mid::after{content:"";position:absolute;top:50%;left:50%;width:10px;height:10px;border-radius:50%;background:#5ec9e8;border:1px solid #17677c;transform:translate(-50%,-50%)}.km-down{color:#0b8d32;font-size:11px;margin-left:7px}.km-up{color:#e45d42;font-size:11px;margin-right:7px}.name{color:#c0c800}.service .name{color:#1689a8}.tag{display:inline-block;background:#168047;color:#fff;border:1px solid #55b97b;border-radius:3px;padding:1px 4px;font-size:10px;margin:1px 2px}.note{margin-top:1rem;color:var(--muted);font-size:.78rem;text-align:center}
@media(max-width:800px){.road-head{align-items:flex-start;flex-direction:column}.route-card{padding:.75rem}.scheme{min-width:760px}}
</style></head><body class="road-page">
<header class="topbar"><a class="sirer-logo" href="./" aria-label="SIRER"><span class="sirer-symbol" aria-hidden="true"><span></span><span></span><span></span></span><span class="sirer-word">SIRER</span></a><div class="network-switch"><label class="sr-only" for="network-select">Seleziona la rete</label><select id="network-select"><option value="./">Reti ferroviarie</option><option value="./autostrade.html" selected>Reti autostradali</option></select></div><form class="line-form" id="road-form"><label class="sr-only" for="road-select">Seleziona autostrada</label><select id="road-select"><option value="A14">Autostrada A14</option><option value="other">Altro</option></select><input id="other-road" placeholder="Es. Autostrada A1" hidden><button id="road-go" hidden>Visualizza</button></form></header>
<main><section class="road-head"><div><h1>Autostrada A14</h1><p class="subtitle">Autostrada Adriatica · Emilia-Romagna</p></div><div class="road-actions"><button class="quiet-button" id="copy">Copia link diretto</button><a class="source-link" href="https://it.wikipedia.org/wiki/Autostrada_A14_(Italia)" target="_blank" rel="noopener">Apri la voce originale</a></div></section>
<section class="route-card"><div class="scheme"><h2 class="route-title">BOLOGNA - CATTOLICA</h2><p class="route-sub">A14 · Autostrada Adriatica</p><div class="directions"><div class="south">↓ direzione Taranto</div><div></div><div class="north">↑ direzione Bologna</div></div><div class="route" id="route"></div></div></section><p class="note">Schema SIRER ricostruito dai dati della tabella “Percorso” della voce Wikipedia “Autostrada A14 (Italia)”.</p></main>
<script>
const rows=[
["Milano","0,0","743,4","link"],["Area di servizio La Pioppa","2,3","741,1","service"],["Bologna Borgo Panigale · Ramo verde · Aeroporto","4,8","738,6","link"],["Ramo Casalecchio · Bologna Casalecchio · Tangenziale · Firenze","8,5","734,9","link"],["Padova · Bologna Arcoveggio","14,3","729,1","link"],["Bologna Fiera","15,5","727,9","exit"],["Bologna San Lazzaro · Tangenziale","22,2","721,2","link"],["Area di servizio Sillaro","37,5","705,9","service"],["Castel San Pietro Terme","38,1","705,3","exit"],["Imola","50,1","693,3","exit"],["Ravenna · Romea · Venezia","56,7","686,7","link"],["Area di servizio Santerno","59,5","683,9","service"],["Faenza","64,5","678,9","exit"],["Forlì · Castrocaro Terme","81,6","661,8","exit"],["Area di servizio Bevano","89,5","653,9","service"],["Cesena nord · E45 · Orte · Roma","93,6","649,8","link"],["Cesena","99,7","643,7","exit"],["Valle del Rubicone","110,1","631,3","exit"],["Area di servizio Rubicone","111,3","630,1","service"],["Rimini nord · Bellaria · Santarcangelo","117,3","626,1","exit"],["Rimini sud · Aeroporto · San Marino","127,4","616,0","link"],["Area di servizio Montefeltro","133,5","609,9","service"],["Riccione","135,4","608,0","exit"],["Cattolica · San Giovanni in Marignano · Gabicce Mare","143,9","599,5","exit"]];
const route=document.querySelector("#route");
for(const [name,down,up,type] of rows){const r=document.createElement("div");r.className="row "+type;const decorated=name.replace(/\b(A1|A13|A14|E45)\b/g,'<span class="tag">$1</span>');r.innerHTML='<div class="left"><span class="name">'+decorated+'</span><span class="km-down">'+down+'</span></div><div class="mid"></div><div class="right"><span class="km-up">'+up+'</span><span class="name">'+decorated+'</span></div>';route.appendChild(r)}
document.querySelector("#network-select").onchange=e=>location.href=e.target.value;const sel=document.querySelector("#road-select"),inp=document.querySelector("#other-road"),go=document.querySelector("#road-go");sel.onchange=()=>{const o=sel.value==="other";inp.hidden=!o;go.hidden=!o;if(o)inp.focus()};document.querySelector("#road-form").onsubmit=e=>{e.preventDefault();if(sel.value==="other"&&inp.value.trim())window.open("https://it.wikipedia.org/wiki/"+encodeURIComponent(inp.value.trim().replace(/ /g,"_")),"_blank")};document.querySelector("#copy").onclick=async()=>{await navigator.clipboard.writeText(location.href);const b=document.querySelector("#copy");b.textContent="Link copiato";setTimeout(()=>b.textContent="Copia link diretto",1400)};
</script></body></html>
